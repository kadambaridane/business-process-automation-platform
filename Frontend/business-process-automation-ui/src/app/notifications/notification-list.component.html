<div class="page-header">
  <h1>Notifications</h1>
  <button type="button" class="btn-secondary" (click)="markAllAsRead()">Mark all as read</button>
</div>

<div class="toolbar">
  <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
    <input type="checkbox" [(ngModel)]="unreadOnly" (ngModelChange)="onFilterChange()" style="width: auto;" />
    Unread only
  </label>
</div>

<div class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

<app-loading-spinner *ngIf="loading()"></app-loading-spinner>

<table class="data-table" *ngIf="!loading()">
  <thead>
    <tr>
      <th>Message</th>
      <th>Type</th>
      <th>Status</th>
      <th>Date</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let notification of notifications()">
      <td>{{ notification.message }}</td>
      <td>{{ notification.type }}</td>
      <td>
        <span class="badge" [class.badge-active]="notification.isRead" [class.badge-inactive]="!notification.isRead">
          {{ notification.isRead ? 'Read' : 'Unread' }}
        </span>
      </td>
      <td>{{ notification.createdDate | date: 'medium' }}</td>
      <td class="actions">
        <button type="button" *ngIf="!notification.isRead" (click)="markAsRead(notification)">Mark as read</button>
      </td>
    </tr>
    <tr *ngIf="notifications().length === 0">
      <td colspan="5" class="empty">No notifications.</td>
    </tr>
  </tbody>
</table>

<app-pagination [page]="page" [totalCount]="totalCount()" [pageSize]="pageSize" (pageChange)="onPageChange($event)"></app-pagination>
